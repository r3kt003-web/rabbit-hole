[project]
name = "autonomus-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.5.2",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.6",
    "streamlit>=1.67.0",
    "trafilatura>=2.3.1",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent = "research_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

